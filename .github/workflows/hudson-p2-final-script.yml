name: Hudson OT P2 final script

on:
  push:
    branches: [codex/hudson-ot-p2-clean]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run audited clean-port helper
        run: bash tools/hudson_ot_p2_final_port.sh
