<div id="S1.Thmtheorem2" class="ltx_theorem ltx_theorem_theorem">
<h6 class="ltx_title ltx_runin ltx_title_theorem"><span class="ltx_tag ltx_tag_theorem"><span id="S1.Thmtheorem2.2" class="ltx_text ltx_font_bold">Theorem 1.2</span></span><span id="S1.Thmtheorem2.3" class="ltx_text ltx_font_bold"> </span>(Informal; see Theorem <a href="#S4.Thmtheorem1" title="Theorem 4.1 (Extension to general 𝜅). ‣ 4 Lower Bound via Hidden Eigenbasis ‣ On Complexity of Gaussian Sampling" class="ltx_ref"><span class="ltx_text ltx_ref_tag">4.1</span></a>)<span id="S1.Thmtheorem2.4" class="ltx_text ltx_font_bold">.</span></h6>
<div id="S1.Thmtheorem2.p1" class="ltx_para">
<p id="S1.Thmtheorem2.p1.1" class="ltx_p"><span id="S1.Thmtheorem2.p1.1.1" class="ltx_text ltx_font_italic">For every fixed <math id="S1.Thmtheorem2.p1.m1" class="ltx_Math" alttext="\delta\in(0,1)" display="inline" intent=":literal"><semantics><mrow><mi>δ</mi><mo>∈</mo><mrow><mo stretchy="false">(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\delta\in(0,1)</annotation></semantics></math>, sufficiently large <math id="S1.Thmtheorem2.p1.m2" class="ltx_Math" alttext="d" display="inline" intent=":literal"><semantics><mi>d</mi><annotation encoding="application/x-tex">d</annotation></semantics></math>,
<math id="S1.Thmtheorem2.p1.m3" class="ltx_Math" alttext="2\leq\kappa\leq d^{1-\delta}" display="inline" intent=":literal"><semantics><mrow><mn>2</mn><mo>≤</mo><mi>κ</mi><mo>≤</mo><msup><mi>d</mi><mrow><mn>1</mn><mo>−</mo><mi>δ</mi></mrow></msup></mrow><annotation encoding="application/x-tex">2\leq\kappa\leq d^{1-\delta}</annotation></semantics></math>, and <math id="S1.Thmtheorem2.p1.m4" class="ltx_Math" alttext="0&lt;\varepsilon\leq 1/10" display="inline" intent=":literal"><semantics><mrow><mn>0</mn><mo>&lt;</mo><mi>ε</mi><mo>≤</mo><mrow><mn>1</mn><mo>/</mo><mn>10</mn></mrow></mrow><annotation encoding="application/x-tex">0&lt;\varepsilon\leq 1/10</annotation></semantics></math>, any Gaussian sampler requires <math id="S1.Thmtheorem2.p1.m5" class="ltx_Math" alttext="\Omega_{\delta}(\sqrt{\kappa}\log d)" display="inline" intent=":literal"><semantics><mrow><msub><mi mathvariant="normal">Ω</mi><mi>δ</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><mrow><msqrt><mi>κ</mi></msqrt><mo lspace="0.167em" rspace="0em">​</mo><mrow><mi>log</mi><mo lspace="0.167em">⁡</mo><mi>d</mi></mrow></mrow><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\Omega_{\delta}(\sqrt{\kappa}\log d)</annotation></semantics></math> queries.</span></p>
</div>
