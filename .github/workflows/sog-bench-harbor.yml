name: Bench native Harbor graph trials

on:
  pull_request:
    paths:
      - 'tools/sog_bench*.py'
      - 'tools/tests/test_sog_bench_harbor.py'
      - 'benchmarks/samplingoptimisationgeometrybench/**'
      - 'AutoSamplingTheory/**'
      - '.github/workflows/sog-bench-harbor.yml'
  push:
    branches: [main]
    paths:
      - 'tools/sog_bench*.py'
      - 'tools/tests/test_sog_bench_harbor.py'
      - 'benchmarks/samplingoptimisationgeometrybench/**'
      - 'AutoSamplingTheory/**'
      - '.github/workflows/sog-bench-harbor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sog-harbor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-software-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test graph adapter and export currently admitted tasks
        run: |
          python -m unittest tools.tests.test_sog_bench_harbor
          python tools/sog_bench_harbor.py export --output .astis/harbor/tasks
          for fixture in oversize symlink fifo missing hook-failure; do
            python tools/sog_bench_harbor.py export --output ".astis/harbor/fixtures/$fixture" --task-id sogb-g001 --fixture "$fixture"
          done
      - name: Install the pinned Harbor wheel and retain resolved environment
        run: |
          mkdir -p .astis/harbor/wheels
          python -m pip download --no-deps harbor==0.25.0 --dest .astis/harbor/wheels
          echo '51923ac567fc57b03279e93468b105f689628bcac2cd3d541d4e44aa5c0ec309  .astis/harbor/wheels/harbor-0.25.0-py3-none-any.whl' | sha256sum --check
          python -m pip install .astis/harbor/wheels/harbor-0.25.0-py3-none-any.whl
          python -m pip freeze > .astis/harbor/resolved-python.txt
          docker version > .astis/harbor/docker-version.txt
      - name: Validate with the actual Harbor schema
        run: |
          python -c "import json; from pathlib import Path; from harbor.models.task.task import Task; root=Path('.astis/harbor/tasks'); ids=json.loads((root/'adapter-manifest.json').read_text())['task_ids']; assert ids and len(ids)==len(set(ids)) and set(ids)=={p.name for p in root.iterdir() if p.is_dir()}; [Task(root / i) for i in ids]"
      - name: Run native oracle and no-answer fixtures (not model measurements)
        env:
          HARBOR_TELEMETRY: '0'
        run: |
          harbor run --path .astis/harbor/tasks --agent oracle --n-concurrent 2 --n-attempts 1 --max-retries 0 --job-name graph-oracle --jobs-dir .astis/harbor/jobs
          harbor run --path .astis/harbor/tasks --agent nop --n-concurrent 2 --n-attempts 1 --max-retries 0 --job-name graph-nop --jobs-dir .astis/harbor/jobs
          for fixture in oversize symlink fifo missing hook-failure; do
            harbor run --path ".astis/harbor/fixtures/$fixture" --agent oracle --n-concurrent 1 --n-attempts 1 --max-retries 0 --job-name "transport-$fixture" --jobs-dir .astis/harbor/jobs
          done
      - name: Require every selected native trial and exact positive/negative outcomes
        run: |
          selected=$(python -c "import json; from pathlib import Path; print(' '.join(json.loads(Path('.astis/harbor/tasks/adapter-manifest.json').read_text())['task_ids']))")
          read -r -a ids <<< "$selected"
          task_args=()
          for id in "${ids[@]}"; do task_args+=(--task-id "$id"); done
          python tools/sog_bench_harbor.py check-job --job .astis/harbor/jobs/graph-oracle --expect-reward 1 "${task_args[@]}"
          python tools/sog_bench_harbor.py check-job --job .astis/harbor/jobs/graph-nop --expect-reward 0 "${task_args[@]}"
          python tools/sog_bench_harbor.py check-job --job .astis/harbor/jobs/transport-oversize --expect-reward 0 --expect-rejection too-large --task-id sogb-g001
          python tools/sog_bench_harbor.py check-job --job .astis/harbor/jobs/transport-symlink --expect-reward 0 --expect-rejection symlink --task-id sogb-g001
          python tools/sog_bench_harbor.py check-job --job .astis/harbor/jobs/transport-fifo --expect-reward 0 --expect-rejection not-regular --task-id sogb-g001
          python tools/sog_bench_harbor.py check-job --job .astis/harbor/jobs/transport-missing --expect-reward 0 --expect-rejection missing --task-id sogb-g001
          python tools/sog_bench_harbor.py check-failed-collection --job .astis/harbor/jobs/transport-hook-failure --task-id sogb-g001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-harbor-graph-software-fixtures
          path: |
            .astis/harbor/tasks
            .astis/harbor/fixtures
            .astis/harbor/jobs
            .astis/harbor/resolved-python.txt
            .astis/harbor/docker-version.txt
          retention-days: 14
