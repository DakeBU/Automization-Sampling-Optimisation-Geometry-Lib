<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">ASTIS Harness architecture: earlier role ladder and current frontier mesh</title>
  <desc id="desc">The earlier ASTIS Harness passed work through Upper, Middle, Lower, and Reviewer roles. The current Harness assigns theorem-sized advances to Universal Workers in Frontier Cells, then uses a Thin Master, independent verification, and a single stabilization lane.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#d6dee9;stroke-width:2}.old{fill:#f4f1ff;stroke:#8b6bd9;stroke-width:2}.new{fill:#eef7ff;stroke:#155eef;stroke-width:2}.worker{fill:#dcfae6;stroke:#087443;stroke-width:2}.verify{fill:#fff2c7;stroke:#9a6700;stroke-width:2}.memory{fill:#f4ebff;stroke:#7f56d9;stroke-width:2}.graph{fill:#dcecff;stroke:#155eef;stroke-width:2.2}.title{fill:#172033;font:700 25px Inter,Arial,sans-serif}.subtitle{fill:#52657a;font:15px Inter,Arial,sans-serif}.panel-title{fill:#172033;font:700 19px Inter,Arial,sans-serif}.node-title{fill:#172033;font:700 16px Inter,Arial,sans-serif}.copy{fill:#52657a;font:13px Inter,Arial,sans-serif}.small{fill:#52657a;font:12px Inter,Arial,sans-serif}.arrow{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#7f56d9;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#purple)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7f56d9"/></marker>
  </defs>

  <rect class="bg" width="1400" height="760" rx="12"/>
  <text class="title" x="700" y="38" text-anchor="middle">ASTIS Harness</text>
  <text class="subtitle" x="700" y="64" text-anchor="middle">same truth discipline · better unit of mathematical work</text>

  <rect class="panel" x="36" y="92" width="470" height="558" rx="12"/>
  <text class="panel-title" x="271" y="125" text-anchor="middle">Earlier role-ladder architecture</text>
  <text class="small" x="271" y="148" text-anchor="middle">one theorem context handed through fixed specialist layers</text>

  <rect class="old" x="101" y="178" width="340" height="74" rx="9"/>
  <text class="node-title" x="271" y="207" text-anchor="middle">UPPER</text>
  <text class="copy" x="271" y="230" text-anchor="middle">source audit · strategy · proof-DAG planning</text>
  <path class="arrow" d="M271 252V282"/>

  <rect class="old" x="101" y="282" width="340" height="74" rx="9"/>
  <text class="node-title" x="271" y="311" text-anchor="middle">MIDDLE</text>
  <text class="copy" x="271" y="334" text-anchor="middle">source ↔ Lean mapping · retrieval · decomposition</text>
  <path class="arrow" d="M271 356V386"/>

  <rect class="old" x="101" y="386" width="340" height="74" rx="9"/>
  <text class="node-title" x="271" y="415" text-anchor="middle">LOWER WORKERS</text>
  <text class="copy" x="271" y="438" text-anchor="middle">proof scout · Lean implementation · API scout</text>
  <path class="arrow" d="M271 460V490"/>

  <rect class="verify" x="101" y="490" width="340" height="86" rx="9"/>
  <text class="node-title" x="271" y="521" text-anchor="middle">REVIEWER</text>
  <text class="copy" x="271" y="544" text-anchor="middle">Lean gate · source fidelity · fake-closure rejection</text>
  <text class="small" x="271" y="563" text-anchor="middle">typed feedback → next cycle</text>

  <rect class="panel" x="532" y="92" width="832" height="558" rx="12"/>
  <text class="panel-title" x="948" y="125" text-anchor="middle">Current ASTIS Harness</text>
  <text class="small" x="948" y="148" text-anchor="middle">theorem-sized advances owned end to end by mathematically general workers</text>

  <rect class="graph" x="690" y="174" width="516" height="62" rx="9"/>
  <text class="node-title" x="948" y="200" text-anchor="middle">Source + verified Lean graph</text>
  <text class="copy" x="948" y="220" text-anchor="middle">textbook · papers · SampleWiki · existing declarations</text>
  <path class="arrow" d="M948 236V261"/>

  <rect class="new" x="690" y="261" width="516" height="68" rx="9"/>
  <text class="node-title" x="948" y="288" text-anchor="middle">SUBSTANTIVE ADVANCE BOARD</text>
  <text class="copy" x="948" y="310" text-anchor="middle">theorem delta · truth boundary · parents · focused checks</text>

  <path class="arrow" d="M790 329V358"/>
  <path class="arrow" d="M948 329V358"/>
  <path class="arrow" d="M1106 329V358"/>

