<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 720" role="img" aria-labelledby="title desc">
<title id="title">Three companion papers in two source-proof routes</title>
<desc id="desc">Red boxes are local proof obligations. Dashed arrows are planned source interfaces, not Lean dependencies. The left route composes SPHMC with Proximal BPS; the right route tracks Gaussian-cloud recursive calls and errors.</desc>
<rect width="1260" height="720" fill="#fff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9c3434"/></marker></defs>
<text x="30" y="35" font-family="sans-serif" font-size="24" fill="#18212f">Three papers → two auditable proof routes</text>
<text x="30" y="62" font-family="sans-serif" font-size="16" fill="#6c3434">RED: local proof open. Dashed: planned interface, not compiler dependency.</text>
<path d="M200.0,200 C200.0,226 200.0,224 200.0,250" fill="none" stroke="#9c3434" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M580.0,200 C580.0,226 580.0,224 580.0,250" fill="none" stroke="#9c3434" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M200.0,350 C200.0,376 390.0,374 390.0,400" fill="none" stroke="#9c3434" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M580.0,350 C580.0,376 390.0,374 390.0,400" fill="none" stroke="#9c3434" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M390.0,500 C390.0,526 390.0,524 390.0,550" fill="none" stroke="#9c3434" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M1040.0,200 C1040.0,226 1040.0,224 1040.0,250" fill="none" stroke="#9c3434" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M1040.0,350 C1040.0,376 1040.0,374 1040.0,400" fill="none" stroke="#9c3434" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M1040.0,500 C1040.0,526 1040.0,524 1040.0,550" fill="none" stroke="#9c3434" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<g id="producer"><rect x="30" y="100" width="340" height="100" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="48" y="139" font-family="sans-serif" font-size="21" fill="#652020">SPHMC</text>
<text x="48" y="170" font-family="sans-serif" font-size="17" fill="#493434">Transport sampler + recursion</text></g>
<g id="consumer"><rect x="410" y="100" width="340" height="100" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="428" y="139" font-family="sans-serif" font-size="21" fill="#652020">Proximal BPS</text>
<text x="428" y="170" font-family="sans-serif" font-size="17" fill="#493434">Warm-start engine</text></g>
<g id="proxy"><rect x="30" y="250" width="340" height="100" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="48" y="289" font-family="sans-serif" font-size="21" fill="#652020">Actual law + proxy witness</text>
<text x="48" y="320" font-family="sans-serif" font-size="17" fill="#493434">TV budget + order-2 Renyi</text></g>
<g id="kernel"><rect x="410" y="250" width="340" height="100" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="428" y="289" font-family="sans-serif" font-size="21" fill="#652020">Implemented probability kernel</text>
<text x="428" y="320" font-family="sans-serif" font-size="17" fill="#493434">Mixing and cost stay separate</text></g>
<g id="join"><rect x="220" y="400" width="340" height="100" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="238" y="439" font-family="sans-serif" font-size="21" fill="#652020">TV-stable handoff</text>
<text x="238" y="470" font-family="sans-serif" font-size="17" fill="#493434">Same target, same kernel</text></g>
<g id="result"><rect x="220" y="550" width="340" height="100" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="238" y="589" font-family="sans-serif" font-size="21" fill="#652020">Cold-to-high-accuracy view</text>
<text x="238" y="620" font-family="sans-serif" font-size="17" fill="#493434">Source theorem; Lean open</text></g>
<g id="cloud"><rect x="860" y="100" width="360" height="100" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="878" y="139" font-family="sans-serif" font-size="21" fill="#652020">Picard HMC Part I</text>
<text x="878" y="170" font-family="sans-serif" font-size="17" fill="#493434">Gaussian cloud correction</text></g>
<g id="forest"><rect x="860" y="250" width="360" height="100" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="878" y="289" font-family="sans-serif" font-size="21" fill="#652020">Adaptive request forest</text>
<text x="878" y="320" font-family="sans-serif" font-size="17" fill="#493434">Queue, children, caps, queries</text></g>
<g id="ledger"><rect x="860" y="400" width="360" height="100" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="878" y="439" font-family="sans-serif" font-size="21" fill="#652020">Conditional-kernel ledger</text>
<text x="878" y="470" font-family="sans-serif" font-size="17" fill="#493434">One delta per slot + one cap error</text></g>
<g id="cloud-result"><rect x="860" y="550" width="360" height="100" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="878" y="589" font-family="sans-serif" font-size="21" fill="#652020">High-accuracy sampler</text>
<text x="878" y="620" font-family="sans-serif" font-size="17" fill="#493434">Source theorem; Lean open</text></g></svg>