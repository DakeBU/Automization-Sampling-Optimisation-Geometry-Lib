<p id="A3.SS4.p3.1" class="ltx_p"><span id="A3.SS4.p3.1.1" class="ltx_text">The associated target is <math id="A3.SS4.p3.m1" class="ltx_Math" alttext="N(0,A^{-1})" display="inline" intent=":literal"><semantics><mrow><mi>N</mi><mo>⁡</mo><mrow><mo stretchy="false">(</mo><mn>0</mn><mo>,</mo><msup><mi>A</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">N(0,A^{-1})</annotation></semantics></math>.
Gaussian integration gives</span></p>

<p id="A3.SS4.p3.2" class="ltx_p"><span id="A3.SS4.p3.2.1" class="ltx_text">Since <math id="A3.SS4.p3.m2" class="ltx_Math" alttext="\Lambda" display="inline" intent=":literal"><semantics><mi mathvariant="normal">Λ</mi><annotation encoding="application/x-tex">\Lambda</annotation></semantics></math> is fixed, <math id="A3.SS4.p3.m3" class="ltx_Math" alttext="Z_{A}" display="inline" intent=":literal"><semantics><msub><mi>Z</mi><mi>A</mi></msub><annotation encoding="application/x-tex">Z_{A}</annotation></semantics></math> is independent of <math id="A3.SS4.p3.m4" class="ltx_Math" alttext="O" display="inline" intent=":literal"><semantics><mi>O</mi><annotation encoding="application/x-tex">O</annotation></semantics></math>
