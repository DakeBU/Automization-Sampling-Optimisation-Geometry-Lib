  <text class="node-title" x="722" y="387" text-anchor="middle">Universal Worker A</text>
  <text class="copy" x="722" y="409" text-anchor="middle">source · proof · retrieval</text>
  <text class="copy" x="722" y="429" text-anchor="middle">Lean · diagnosis · refactor</text>

  <rect class="worker" x="856" y="358" width="184" height="90" rx="9"/>
  <text class="node-title" x="948" y="387" text-anchor="middle">Worker B</text>
  <text class="copy" x="948" y="409" text-anchor="middle">another independent</text>
  <text class="copy" x="948" y="429" text-anchor="middle">theorem delta</text>

  <rect class="worker" x="1056" y="358" width="236" height="90" rx="9"/>
  <text class="node-title" x="1174" y="387" text-anchor="middle">Universal Worker C</text>
  <text class="copy" x="1174" y="409" text-anchor="middle">source · proof · retrieval</text>
  <text class="copy" x="1174" y="429" text-anchor="middle">Lean · diagnosis · refactor</text>

  <rect class="memory" x="604" y="472" width="300" height="66" rx="9"/>
  <text class="node-title" x="754" y="499" text-anchor="middle">Frontier Cell reducer</text>
  <text class="copy" x="754" y="520" text-anchor="middle">graph delta · blockers · conflicts</text>
  <rect class="memory" x="992" y="472" width="300" height="66" rx="9"/>
  <text class="node-title" x="1142" y="499" text-anchor="middle">Discovery Ledger</text>
  <text class="copy" x="1142" y="520" text-anchor="middle">lemmas · interfaces · counterexamples</text>
  <path class="arrow" d="M722 448V472"/><path class="arrow" d="M948 448V460H754V472"/><path class="arrow" d="M1174 448V472"/>
  <path class="dash" d="M904 505H992"/>

  <rect class="new" x="785" y="558" width="326" height="66" rx="9"/>
  <text class="node-title" x="948" y="585" text-anchor="middle">Thin Master</text>
  <text class="copy" x="948" y="606" text-anchor="middle">cross-frontier priority · joins · conflicts only</text>
  <path class="arrow" d="M754 538V550H948V558"/>
  <path class="arrow" d="M1142 538V550H948V558"/>

  <rect class="verify" x="546" y="670" width="250" height="58" rx="9"/>
  <text class="node-title" x="671" y="695" text-anchor="middle">Independent verification</text>
  <text class="small" x="671" y="714" text-anchor="middle">Lean · source · fake closure</text>
  <rect class="new" x="815" y="670" width="250" height="58" rx="9"/>
  <text class="node-title" x="940" y="695" text-anchor="middle">Single stabilization lane</text>
  <text class="small" x="940" y="714" text-anchor="middle">shared repository truth</text>
  <rect class="graph" x="1084" y="670" width="250" height="58" rx="9"/>
  <text class="node-title" x="1209" y="695" text-anchor="middle">Samplinglib + Lean Graph</text>
  <text class="small" x="1209" y="714" text-anchor="middle">verified reusable memory</text>
  <path class="arrow" d="M948 624V646H671V670"/>
  <path class="arrow" d="M796 699H815"/>
  <path class="arrow" d="M1065 699H1084"/>

  <rect class="panel" x="36" y="666" width="470" height="68" rx="10"/>
  <text class="node-title" x="271" y="692" text-anchor="middle">What stays invariant</text>
  <text class="small" x="271" y="713" text-anchor="middle">source fidelity · typed evidence · durable failures · independent review</text>
