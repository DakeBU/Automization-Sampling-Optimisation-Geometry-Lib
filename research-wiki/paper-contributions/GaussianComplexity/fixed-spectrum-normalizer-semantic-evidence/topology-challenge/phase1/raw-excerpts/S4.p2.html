<div id="S4.p2" class="ltx_para">
<p id="S4.p2.1" class="ltx_p">Compared with Theorem <a href="#S3.Thmtheorem1" title="Theorem 3.1 (Gaussian sampling lower bound). ‣ 3 Lower Bound via Hidden Determinant Sign ‣ On Complexity of Gaussian Sampling" class="ltx_ref"><span class="ltx_text ltx_ref_tag">3.1</span></a>, this bound also covers <math id="S4.p2.m1" class="ltx_Math" alttext="2\leq\kappa&lt;4" display="inline" intent=":literal"><semantics><mrow><mn>2</mn><mo>≤</mo><mi>κ</mi><mo>&lt;</mo><mn>4</mn></mrow><annotation encoding="application/x-tex">2\leq\kappa&lt;4</annotation></semantics></math> and
<math id="S4.p2.m2" class="ltx_Math" alttext="\frac{1}{16}&lt;\varepsilon\leq\frac{1}{10}" display="inline" intent=":literal"><semantics><mrow><mfrac><mn>1</mn><mn>16</mn></mfrac><mo>&lt;</mo><mi>ε</mi><mo>≤</mo><mfrac><mn>1</mn><mn>10</mn></mfrac></mrow><annotation encoding="application/x-tex">\frac{1}{16}&lt;\varepsilon\leq\frac{1}{10}</annotation></semantics></math>, and it holds even when the spectrum of <math id="S4.p2.m3" class="ltx_Math" alttext="A" display="inline" intent=":literal"><semantics><mi>A</mi><annotation encoding="application/x-tex">A</annotation></semantics></math> is known to
the algorithm. On the other hand, it does not grow as <math id="S4.p2.m4" class="ltx_Math" alttext="\varepsilon\to 0" display="inline" intent=":literal"><semantics><mrow><mi>ε</mi><mo stretchy="false">→</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\varepsilon\to 0</annotation></semantics></math> and it requires <math id="S4.p2.m5" class="ltx_Math" alttext="\kappa\leq d^{1-\delta}" display="inline" intent=":literal"><semantics><mrow><mi>κ</mi><mo>≤</mo><msup><mi>d</mi><mrow><mn>1</mn><mo>−</mo><mi>δ</mi></mrow></msup></mrow><annotation encoding="application/x-tex">\kappa\leq d^{1-\delta}</annotation></semantics></math>.</p>
</div>
