<p id="A2.SS1.SSS0.Px1.p1.2" class="ltx_p">We call a query <math id="A2.SS1.SSS0.Px1.p1.m1" class="ltx_Math" alttext="(j,v,\tau)" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">(</mo><mi>j</mi><mo>,</mo><mi>v</mi><mo>,</mo><mi>τ</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(j,v,\tau)</annotation></semantics></math> to
this oracle a primitive query; it is forward if <math id="A2.SS1.SSS0.Px1.p1.m2" class="ltx_Math" alttext="\tau=\mathsf{f}" display="inline" intent=":literal"><semantics><mrow><mi>τ</mi><mo>=</mo><mi>𝖿</mi></mrow><annotation encoding="application/x-tex">\tau=\mathsf{f}</annotation></semantics></math>,
and inverse if <math id="A2.SS1.SSS0.Px1.p1.m3" class="ltx_Math" alttext="\tau=\mathsf{i}" display="inline" intent=":literal"><semantics><mrow><mi>τ</mi><mo>=</mo><mi>𝗂</mi></mrow><annotation encoding="application/x-tex">\tau=\mathsf{i}</annotation></semantics></math>.
