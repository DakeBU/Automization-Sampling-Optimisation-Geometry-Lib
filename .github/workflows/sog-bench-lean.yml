name: Bench isolated Lean runtime trials
on:
  pull_request:
    paths:
      - 'tools/sog_bench_lean*.py'
      - 'tools/tests/test_sog_bench_lean*.py'
      - 'benchmarks/samplingoptimisationgeometrybench/lean-runtime/**'
      - 'benchmarks/samplingoptimisationgeometrybench/cores.json'
      - 'benchmarks/samplingoptimisationgeometrybench/reviews/**'
      - 'runs/20261110-bench-local-lean-first/**'
      - 'tools/sog_bench.py'
      - 'AutoSamplingTheory/**'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'lakefile.lean'
      - '.github/workflows/sog-bench-lean.yml'
  push:
    branches: [main]
    paths:
      - 'tools/sog_bench_lean*.py'
      - 'tools/tests/test_sog_bench_lean*.py'
      - 'benchmarks/samplingoptimisationgeometrybench/lean-runtime/**'
      - 'benchmarks/samplingoptimisationgeometrybench/cores.json'
      - 'benchmarks/samplingoptimisationgeometrybench/reviews/**'
      - 'runs/20261110-bench-local-lean-first/**'
      - 'tools/sog_bench.py'
      - 'AutoSamplingTheory/**'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'lakefile.lean'
      - '.github/workflows/sog-bench-lean.yml'
  workflow_dispatch:
    inputs:
      local_model_pilot:
        description: 'Run the opt-in pinned CPU model with live isolated Lean feedback (public-dev)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sog-lean-${{ github.ref }}-${{ inputs.local_model_pilot && 'local-model' || 'software' }}
  cancel-in-progress: true
jobs:
  native-lanes:
    name: native-runtime / ${{ matrix.lane }}
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.local_model_pilot }}
    strategy:
      fail-fast: false
      matrix:
        lane: [catalogue, behaviour]
    runs-on: ubuntu-24.04
    # Bound each runner separately, not the submitted Lean resource policy.
    timeout-minutes: 65
    outputs:
      catalogue_ready: ${{ steps.catalogue-evidence.outputs.ready }}
      behaviour_ready: ${{ steps.behaviour-evidence.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Test packet and isolation argument contracts
        run: python -m unittest tools.tests.test_sog_bench_lean tools.tests.test_sog_bench_lean_model tools.tests.test_sog_bench_lean_external tools.tests.test_sog_bench_lean_stdio tools.tests.test_sog_bench_lean_retrieval tools.tests.test_sog_bench_lean_capture tools.tests.test_sog_bench_lean_local
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
      - name: Compile trusted task ancestors and references only
        run: python tools/sog_bench.py check-lean
      - name: Build pinned official tools and record immutable runtime
        run: python tools/sog_bench_lean_native.py prepare --output .astis/lean-native
      - name: Actually test every admitted aligned target and negative software fixtures
        if: matrix.lane == 'catalogue'
        run: python tools/sog_bench_lean_native.py trials --runtime .astis/lean-native
      - name: Verify the fixed targets needed by the behaviour fixtures
        if: matrix.lane == 'behaviour'
        run: python tools/sog_bench_lean_native.py trials --runtime .astis/lean-native --behaviour-fixtures
      - name: Actually probe denied I/O and bounded resource and input failures
        if: matrix.lane == 'behaviour'
        run: python tools/sog_bench_lean_native.py hostile-trials --runtime .astis/lean-native
      - name: Replay compiler feedback and immutable first-final accounting
        if: matrix.lane == 'behaviour'
        run: python tools/sog_bench_lean_native.py workspace-trials --runtime .astis/lean-native
      - name: Exercise scripted model interface and canonical infrastructure rollup
        if: matrix.lane == 'behaviour'
        run: python tools/sog_bench_lean_native.py model-bridge-trials --runtime .astis/lean-native
      - name: Reject a changed target through the credential-free JSONL bridge
        if: matrix.lane == 'behaviour'
        run: python tools/sog_bench_lean_native.py stdio-bridge-trial --runtime .astis/lean-native
      - name: Interleave bounded graph lookup and real Lean verification
        if: matrix.lane == 'behaviour'
        run: python tools/sog_bench_lean_native.py graph-stdio-trial --runtime .astis/lean-native
      - name: Verify the frozen real one-shot model answer, without repair
        if: matrix.lane == 'behaviour'
        run: >-
          python tools/sog_bench_lean_capture.py verify
          --capture runs/20261110-bench-local-lean-first/raw
          --receipt-sha256 17162dc147147f1e6b7849d4528f3d0f5f5b4dc1266b7d2eb532076428d1fa5c
          --task .astis/lean-native/tasks/sogb-015
          --stage .astis/lean-native/stages/sogb-015
          --runtime .astis/lean-native
          --output .astis/lean-native/model-first-capture
      - name: Seal the catalogue receipt
        id: catalogue-evidence
        if: matrix.lane == 'catalogue'
        shell: bash
        run: |
          test -s .astis/lean-native/software-trials.json
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
      - name: Seal the behaviour receipts
        id: behaviour-evidence
        if: matrix.lane == 'behaviour'
        shell: bash
        run: |
          root=.astis/lean-native
          test -s "$root/software-trials.json"
          test -s "$root/hostile-trials.json"
          test -s "$root/workspace-trials.json"
          test -s "$root/model-bridge-trials.json"
          test -s "$root/stdio-bridge-trial/summary.json"
          test -s "$root/graph-stdio-trial/summary.json"
          test -s "$root/model-first-capture/outcome.json"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sog-lean-native-${{ matrix.lane }}-software-evidence
          if-no-files-found: error
          path: |
            .astis/lean-native/preparation-inputs.json
            .astis/lean-native/preparation.json
            .astis/lean-native/software-trials.json
            .astis/lean-native/hostile-trials.json
            .astis/lean-native/hostile-trials
            .astis/lean-native/workspace-trials.json
            .astis/lean-native/workspace-trials
            .astis/lean-native/model-bridge-trials.json
            .astis/lean-native/model-bridge-trials
            .astis/lean-native/stdio-bridge-trial
            .astis/lean-native/graph-stdio-trial
            .astis/lean-native/model-first-capture
            .astis/lean-native/image-id
            .astis/lean-native/trials
          retention-days: 14
  native-runtime:
    # Preserve the existing required check. A skipped/cancelled lane is not
    # success, and neither lane may stand in for the other.
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.local_model_pilot) }}
    needs: [native-lanes]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both native lanes and their receipts
        shell: bash
        env:
          LANES_RESULT: ${{ needs.native-lanes.result }}
          CATALOGUE_READY: ${{ needs.native-lanes.outputs.catalogue_ready }}
          BEHAVIOUR_READY: ${{ needs.native-lanes.outputs.behaviour_ready }}
        run: |
          test "$LANES_RESULT" = success
          test "$CATALOGUE_READY" = true
          test "$BEHAVIOUR_READY" = true
  live-local-model-pilot:
    # A PR or push never starts downloads/inference for this diagnostic.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.local_model_pilot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
      - name: Prepare the same pinned isolation and one checked public-dev target
        run: |
          lake build Mathlib.MeasureTheory.Measure.Prod
          python tools/sog_bench_lean_native.py prepare --output .astis/lean-local-runtime
          python tools/sog_bench_lean.py export --output .astis/lean-local-tasks --task-id sogb-015
          python tools/sog_bench_lean.py stage --task .astis/lean-local-tasks/sogb-015 --output .astis/lean-local-stage
      - name: Provision the pinned public CPU model and inference dependencies
        run: |
          mkdir -p .astis/lean-local-weights .astis/lean-local-host
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0+cpu'
          python -m pip install 'transformers==5.11.0' 'safetensors==0.8.0'
          python -m pip freeze > .astis/lean-local-host/pip-freeze.txt
          docker version > .astis/lean-local-host/docker-version.txt
          for asset in LICENSE config.json generation_config.json merges.txt model.safetensors tokenizer.json tokenizer_config.json vocab.json; do
            curl --fail --silent --show-error --location --proto '=https' --connect-timeout 20 --max-time 600 --max-filesize 1050000000 \
              --output ".astis/lean-local-weights/$asset" \
              "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/resolve/7ae557604adf67be50417f59c2c2f167def9a775/$asset"
          done
      - name: Generate, receive isolated feedback, then submit once
        run: >-
          python tools/sog_bench_lean_local.py
          --task .astis/lean-local-tasks/sogb-015
          --stage .astis/lean-local-stage
          --runtime .astis/lean-local-runtime
          --model-directory .astis/lean-local-weights
          --output .astis/lean-local-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sog-lean-local-model-public-dev-evidence
          path: |
            .astis/lean-local-evidence
            .astis/lean-local-host
            .astis/lean-local-runtime/preparation.json
          retention-days: 14
