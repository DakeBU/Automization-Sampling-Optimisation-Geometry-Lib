name: Repair SampleWiki quantum cross-link TeX
on:
  push:
    branches:
      - agent/samplewiki-schrodingerisation-link-20260916
    paths:
      - .github/scripts/fix_samplewiki_quantum_fstring_20260916.py
      - .github/workflows/fix-samplewiki-quantum-fstring-20260916.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/samplewiki-schrodingerisation-link-20260916
          fetch-depth: 0
      - run: python3 .github/scripts/fix_samplewiki_quantum_fstring_20260916.py
      - run: |
          python3 -m py_compile website/scripts/samplewiki_reader_contract.py
          python3 -m unittest tools.tests.test_samplewiki_reader_contract
          grep -Fq '2^{{n_p}}' website/scripts/samplewiki_reader_contract.py
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/fix_samplewiki_quantum_fstring_20260916.py .github/workflows/fix-samplewiki-quantum-fstring-20260916.yml
          git add website/scripts/samplewiki_reader_contract.py
          git commit -m 'Fix SampleWiki Schrödingerisation formula rendering'
          git push origin HEAD:agent/samplewiki-schrodingerisation-link-20260916
