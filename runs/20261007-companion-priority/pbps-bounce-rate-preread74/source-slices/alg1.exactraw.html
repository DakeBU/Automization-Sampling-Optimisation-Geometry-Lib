<figure id="alg1" class="ltx_float ltx_float_algorithm ltx_framed ltx_framed_top">
<figcaption class="ltx_caption"><span class="ltx_tag ltx_tag_float"><span id="alg1.3" class="ltx_text ltx_font_bold">Algorithm 1</span> </span> Simulation of the ideal conditional half-turn process</figcaption>
<div id="alg1.4" class="ltx_listing ltx_framed ltx_framed_topbottom ltx_listing">
<div id="alg1.l1" class="ltx_listingline">
              <span class="ltx_tag ltx_tag_listingline"><span id="alg1.l1.1" class="ltx_text" style="font-size:80%;">1:</span></span>
              
              
            <span id="alg1.l1.3" class="ltx_text ltx_font_bold">Input:</span> state <math id="alg1.l1.m1" class="ltx_Math" alttext="(x,y)" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(x,y)</annotation></semantics></math>

</div>
<div id="alg1.l2" class="ltx_listingline">
              <span class="ltx_tag ltx_tag_listingline"><span id="alg1.l2.1" class="ltx_text" style="font-size:80%;">2:</span></span>
              
              
            Draw <math id="alg1.l2.m1" class="ltx_Math" alttext="\widetilde{X}\sim\pi_{\eta}^{X\mid Y=y}" display="inline" intent=":literal"><semantics><mrow><mover accent="true"><mi>X</mi><mo mathsize="0.900em">~</mo></mover><mo>∼</mo><msubsup><mi>π</mi><mi>η</mi><mrow><mi>X</mi><mo fence="false">|</mo><mrow><mi>Y</mi><mo>=</mo><mi>y</mi></mrow></mrow></msubsup></mrow><annotation encoding="application/x-tex">\widetilde{X}\sim\pi_{\eta}^{X\mid Y=y}</annotation></semantics></math> and
<math id="alg1.l2.m2" class="ltx_Math" alttext="p_{0}\sim\mathcal{N}(0,I)" display="inline" intent=":literal"><semantics><mrow><msub><mi>p</mi><mn>0</mn></msub><mo>∼</mo><mrow><mi class="ltx_font_mathcaligraphic">𝒩</mi><mo>⁡</mo><mrow><mo stretchy="false">(</mo><mn>0</mn><mo>,</mo><mi>I</mi><mo stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">p_{0}\sim\mathcal{N}(0,I)</annotation></semantics></math> independently.

</div>
<div id="alg1.l3" class="ltx_listingline">
              <span class="ltx_tag ltx_tag_listingline"><span id="alg1.l3.1" class="ltx_text" style="font-size:80%;">3:</span></span>
              
              
            Query <math id="alg1.l3.m1" class="ltx_Math" alttext="\nabla V(\widetilde{X})" display="inline" intent=":literal"><semantics><mrow><mrow><mo rspace="0.167em">∇</mo><mi>V</mi></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><mover accent="true"><mi>X</mi><mo mathsize="0.900em">~</mo></mover><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\nabla V(\widetilde{X})</annotation></semantics></math>.

</div>
<div id="alg1.l4" class="ltx_listingline">
              <span class="ltx_tag ltx_tag_listingline"><span id="alg1.l4.1" class="ltx_text" style="font-size:80%;">4:</span></span>
              
              
            Set <math id="alg1.l4.m1" class="ltx_Math" alttext="x_{0}\leftarrow x" display="inline" intent=":literal"><semantics><mrow><msub><mi>x</mi><mn>0</mn></msub><mo stretchy="false">←</mo><mi>x</mi></mrow><annotation encoding="application/x-tex">x_{0}\leftarrow x</annotation></semantics></math>.

</div>
<div id="alg1.l5" class="ltx_listingline">
              <span class="ltx_tag ltx_tag_listingline"><span id="alg1.l5.1" class="ltx_text" style="font-size:80%;">5:</span></span>
              
              
            Evolve <math id="alg1.l5.m1" class="ltx_Math" alttext="(x_{t},p_{t})" display="inline" intent=":literal"><semantics><mrow><mo stretchy="false">(</mo><msub><mi>x</mi><mi>t</mi></msub><mo>,</mo><msub><mi>p</mi><mi>t</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(x_{t},p_{t})</annotation></semantics></math> according to

<table id="S3.E8" class="ltx_equation ltx_eqn_table">

<tbody><tr class="ltx_equation ltx_eqn_row ltx_align_baseline">
<td class="ltx_eqn_cell ltx_eqn_center_padleft"></td>
<td class="ltx_eqn_cell ltx_align_center"><math id="S3.E8.m1" class="ltx_math_unparsed" alttext="\dot{x}=\sqrt{\eta}\,p\,,\hskip 20.00003pt\dot{p}=-\frac{x-y}{\sqrt{\eta}}-\sqrt{\eta}\,\nabla V(\widetilde{X})\,," display="block" intent=":literal"><semantics><mrow><mover accent="true"><mi>x</mi><mo mathsize="0.900em">˙</mo></mover><mo>=</mo><msqrt><mi>η</mi></msqrt><mi>p</mi><mo lspace="0.150em" rspace="2.167em">,</mo><mover accent="true"><mi>p</mi><mo mathsize="0.900em">˙</mo></mover><mo rspace="0em">=</mo><mo lspace="0em">−</mo><mfrac><mrow><mi>x</mi><mo>−</mo><mi>y</mi></mrow><msqrt><mi>η</mi></msqrt></mfrac><mo>−</mo><msqrt><mi>η</mi></msqrt><mo lspace="0.317em" rspace="0.167em">∇</mo><mi>V</mi><mrow><mo stretchy="false">(</mo><mover accent="true"><mi>X</mi><mo mathsize="0.900em">~</mo></mover><mo rspace="0.150em" stretchy="false">)</mo></mrow><mo>,</mo></mrow><annotation encoding="application/x-tex">\dot{x}=\sqrt{\eta}\,p\,,\hskip 20.00003pt\dot{p}=-\frac{x-y}{\sqrt{\eta}}-\sqrt{\eta}\,\nabla V(\widetilde{X})\,,</annotation></semantics></math></td>
<td class="ltx_eqn_cell ltx_eqn_center_padright"></td>
<td rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(3.8)</span></td></tr></tbody>
</table>until <math id="alg1.l5.m2" class="ltx_Math" alttext="t=\pi" display="inline" intent=":literal"><semantics><mrow><mi>t</mi><mo>=</mo><mi>π</mi></mrow><annotation encoding="application/x-tex">t=\pi</annotation></semantics></math>.

</div>
<div id="alg1.l6" class="ltx_listingline">
              <span class="ltx_tag ltx_tag_listingline"><span id="alg1.l6.1" class="ltx_text" style="font-size:80%;">6:</span></span>
              
              
            During the evolution, generate bounce events at rate

<table id="S3.E9" class="ltx_equation ltx_eqn_table">

<tbody><tr class="ltx_equation ltx_eqn_row ltx_align_baseline">
<td class="ltx_eqn_cell ltx_eqn_center_padleft"></td>
<td class="ltx_eqn_cell ltx_align_center"><math id="S3.E9.m1" class="ltx_Math" alttext="\lambda_{\widetilde{X}}(x,p)=\sqrt{\eta}\,\bigl[p^{\top}[\nabla V(x)-\nabla V(\widetilde{X})]\bigr]_{+}\,." display="block" intent=":literal"><semantics><mrow><mrow><mrow><msub><mi>λ</mi><mover accent="true"><mi>X</mi><mo mathsize="1.280em">~</mo></mover></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>p</mi><mo stretchy="false">)</mo></mrow></mrow><mo>=</mo><mrow><msqrt><mi>η</mi></msqrt><mo lspace="0.150em" rspace="0em">​</mo><msub><mrow><mo maxsize="1.200em" minsize="1.200em">[</mo><mrow><msup><mi>p</mi><mo>⊤</mo></msup><mo lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">[</mo><mrow><mrow><mrow><mo rspace="0.167em">∇</mo><mi>V</mi></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow></mrow><mo>−</mo><mrow><mrow><mo rspace="0.167em">∇</mo><mi>V</mi></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><mover accent="true"><mi>X</mi><mo mathsize="0.900em">~</mo></mover><mo stretchy="false">)</mo></mrow></mrow></mrow><mo stretchy="false">]</mo></mrow></mrow><mo maxsize="1.200em" minsize="1.200em">]</mo></mrow><mo>+</mo></msub></mrow></mrow><mo lspace="0em">.</mo></mrow><annotation encoding="application/x-tex">\lambda_{\widetilde{X}}(x,p)=\sqrt{\eta}\,\bigl[p^{\top}[\nabla V(x)-\nabla V(\widetilde{X})]\bigr]_{+}\,.</annotation></semantics></math></td>
<td class="ltx_eqn_cell ltx_eqn_center_padright"></td>
<td rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(3.9)</span></td></tr></tbody>
</table>
</div>
<div id="alg1.l7" class="ltx_listingline">
              <span class="ltx_tag ltx_tag_listingline"><span id="alg1.l7.1" class="ltx_text" style="font-size:80%;">7:</span></span>
              
              
            At each bounce, set
<math id="alg1.l7.m1" class="ltx_Math" alttext="p_{t}\leftarrow R_{\nabla V(x_{t})-\nabla V(\widetilde{X})}p_{t}" display="inline" intent=":literal"><semantics><mrow><msub><mi>p</mi><mi>t</mi></msub><mo stretchy="false">←</mo><mrow><msub><mi>R</mi><mrow><mrow><mrow><mo rspace="0.167em">∇</mo><mi>V</mi></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><msub><mi>x</mi><mi>t</mi></msub><mo stretchy="false">)</mo></mrow></mrow><mo>−</mo><mrow><mrow><mo rspace="0.167em">∇</mo><mi>V</mi></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><mover accent="true"><mi>X</mi><mo mathsize="1.280em">~</mo></mover><mo stretchy="false">)</mo></mrow></mrow></mrow></msub><mo lspace="0em" rspace="0em">​</mo><msub><mi>p</mi><mi>t</mi></msub></mrow></mrow><annotation encoding="application/x-tex">p_{t}\leftarrow R_{\nabla V(x_{t})-\nabla V(\widetilde{X})}p_{t}</annotation></semantics></math>.

</div>
<div id="alg1.l8" class="ltx_listingline">
              <span class="ltx_tag ltx_tag_listingline"><span id="alg1.l8.1" class="ltx_text" style="font-size:80%;">8:</span></span>
              
              
            <span id="alg1.l8.3" class="ltx_text ltx_font_bold">return</span> <math id="alg1.l8.m1" class="ltx_Math" alttext="x_{\pi}" display="inline" intent=":literal"><semantics><msub><mi>x</mi><mi>π</mi></msub><annotation encoding="application/x-tex">x_{\pi}</annotation></semantics></math>

</div>
</div>
</figure>
