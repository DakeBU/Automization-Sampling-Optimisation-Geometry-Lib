<div id="S2.p1" class="ltx_para">
<p id="S2.p1.1" class="ltx_p">We write <math id="S2.p1.m1" class="ltx_math_unparsed" alttext="\|\cdot\|" display="inline" intent=":literal"><semantics><mrow><mo rspace="0em">∥</mo><mo lspace="0em" rspace="0em">⋅</mo><mo lspace="0em">∥</mo></mrow><annotation encoding="application/x-tex">\|\cdot\|</annotation></semantics></math> for the Euclidean norm and <math id="S2.p1.m2" class="ltx_Math" alttext="I_{d}" display="inline" intent=":literal"><semantics><msub><mi>I</mi><mi>d</mi></msub><annotation encoding="application/x-tex">I_{d}</annotation></semantics></math> for the
<math id="S2.p1.m3" class="ltx_Math" alttext="d\times d" display="inline" intent=":literal"><semantics><mrow><mi>d</mi><mo lspace="0.222em" rspace="0.222em">×</mo><mi>d</mi></mrow><annotation encoding="application/x-tex">d\times d</annotation></semantics></math> identity matrix.
For symmetric matrices <math id="S2.p1.m4" class="ltx_Math" alttext="A" display="inline" intent=":literal"><semantics><mi>A</mi><annotation encoding="application/x-tex">A</annotation></semantics></math> and <math id="S2.p1.m5" class="ltx_Math" alttext="B" display="inline" intent=":literal"><semantics><mi>B</mi><annotation encoding="application/x-tex">B</annotation></semantics></math>, the notation <math id="S2.p1.m6" class="ltx_Math" alttext="A\preceq B" display="inline" intent=":literal"><semantics><mrow><mi>A</mi><mo>⪯</mo><mi>B</mi></mrow><annotation encoding="application/x-tex">A\preceq B</annotation></semantics></math>
means that <math id="S2.p1.m7" class="ltx_Math" alttext="B-A" display="inline" intent=":literal"><semantics><mrow><mi>B</mi><mo>−</mo><mi>A</mi></mrow><annotation encoding="application/x-tex">B-A</annotation></semantics></math> is positive semidefinite.</p>
</div>
