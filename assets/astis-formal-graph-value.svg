<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc">
  <title id="title">From AI proof text to verified graph contribution</title>
  <desc id="desc">Plain AI proof generation produces fluent proof text without a Lean certificate or reusable formal interface. ASTIS turns source-backed reasoning into checked Lean declarations and places them in the Underlying Lean Graph, where new work can be understood as a leaf, bridge, shortcut, reusable hub, or structural reorganization.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#d6dee9;stroke-width:2}.bad{fill:#fff4f2;stroke:#d92d20;stroke-width:2}.good{fill:#ecfdf3;stroke:#087443;stroke-width:2}.lean{fill:#eef4ff;stroke:#155eef;stroke-width:2}.graph{fill:#f4ebff;stroke:#7f56d9;stroke-width:2}.title{fill:#172033;font:700 25px Inter,Arial,sans-serif}.panel-title{fill:#172033;font:700 18px Inter,Arial,sans-serif}.node-title{fill:#172033;font:700 15px Inter,Arial,sans-serif}.copy{fill:#52657a;font:13px Inter,Arial,sans-serif}.small{fill:#667085;font:12px Inter,Arial,sans-serif}.arrow{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}.edge{stroke:#7f56d9;stroke-width:3;fill:none}.node{fill:#fff;stroke:#7f56d9;stroke-width:2}.newnode{fill:#dcfae6;stroke:#087443;stroke-width:2.5}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker>
  </defs>

  <rect class="bg" width="1440" height="610" rx="12"/>
  <text class="title" x="720" y="38" text-anchor="middle">Why a verified formal graph changes the research object</text>

  <rect class="panel" x="30" y="70" width="400" height="505" rx="12"/>
  <text class="panel-title" x="230" y="105" text-anchor="middle">Plain AI proof generation</text>
  <rect class="bad" x="75" y="142" width="310" height="76" rx="9"/>
  <text class="node-title" x="230" y="171" text-anchor="middle">Paper / problem → fluent proof prose</text>
  <text class="copy" x="230" y="196" text-anchor="middle">useful ideas, but no mechanical certificate</text>
  <path class="arrow" d="M230 218V250"/>
  <rect class="bad" x="75" y="250" width="310" height="205" rx="9"/>
  <text class="node-title" x="230" y="282" text-anchor="middle">What remains uncertain</text>
  <text class="copy" x="230" y="315" text-anchor="middle">hidden assumptions</text>
  <text class="copy" x="230" y="343" text-anchor="middle">type / boundary mismatches</text>
  <text class="copy" x="230" y="371" text-anchor="middle">statement drift</text>
  <text class="copy" x="230" y="399" text-anchor="middle">no callable verified interface</text>
  <text class="small" x="230" y="427" text-anchor="middle">
    <tspan x="230" dy="0">later proofs may rediscover</tspan>
    <tspan x="230" dy="17">the same idea from scratch</tspan>
  </text>
  <text class="small" x="230" y="510" text-anchor="middle">Result = isolated proof text</text>

  <rect class="panel" x="455" y="70" width="400" height="505" rx="12"/>
  <text class="panel-title" x="655" y="105" text-anchor="middle">ASTIS</text>
  <rect class="good" x="510" y="138" width="290" height="66" rx="9"/>
  <text class="node-title" x="655" y="165" text-anchor="middle">Source-backed mathematical advance</text>
  <text class="copy" x="655" y="189" text-anchor="middle">exact theorem delta + truth boundary</text>
  <path class="arrow" d="M655 204V234"/>
  <rect class="lean" x="510" y="234" width="290" height="80" rx="9"/>
  <text class="node-title" x="655" y="263" text-anchor="middle">Lean-checked declaration</text>
  <text class="copy" x="655" y="288" text-anchor="middle">exact hypotheses · types · proof term</text>
  <path class="arrow" d="M655 314V344"/>
  <rect class="graph" x="510" y="344" width="290" height="106" rx="9"/>
  <text class="node-title" x="655" y="374" text-anchor="middle">Reusable formal memory</text>
  <text class="copy" x="655" y="400" text-anchor="middle">named parents + consumers</text>
  <text class="copy" x="655" y="425" text-anchor="middle">retrievable by later human / AI proofs</text>
  <text class="small" x="655" y="505" text-anchor="middle">
    <tspan x="655" dy="0">Result = checked node or connection</tspan>
    <tspan x="655" dy="17">in the field graph</tspan>
  </text>

  <rect class="panel" x="880" y="70" width="530" height="505" rx="12"/>
  <text class="panel-title" x="1145" y="103" text-anchor="middle">
    <tspan x="1145" dy="0">What does new work add</tspan>
    <tspan x="1145" dy="22">to the formal graph?</tspan>
  </text>
  <text class="small" x="1145" y="148" text-anchor="middle">read contribution as a graph change, not only a new statement</text>

  <text class="node-title" x="925" y="200">Leaf</text>
  <path class="edge" d="M1020 195H1080"/><circle class="node" cx="1020" cy="195" r="11"/><circle class="newnode" cx="1092" cy="195" r="13"/>
  <text class="small" x="1160" y="188">
    <tspan x="1160" dy="0">adds a terminal</tspan>
    <tspan x="1160" dy="17">consequence</tspan>
  </text>

  <text class="node-title" x="925" y="275">Bridge</text>
  <circle class="node" cx="1020" cy="263" r="11"/><circle class="newnode" cx="1090" cy="283" r="13"/><circle class="node" cx="1160" cy="263" r="11"/>
  <path class="edge" d="M1031 266L1079 280M1101 280L1149 266"/>
  <text class="small" x="1210" y="258">
    <tspan x="1210" dy="0">joins separate</tspan>
    <tspan x="1210" dy="17">branches</tspan>
  </text>

  <text class="node-title" x="925" y="350">Shortcut</text>
  <circle class="node" cx="1020" cy="338" r="10"/><circle class="node" cx="1080" cy="338" r="10"/><circle class="node" cx="1140" cy="338" r="10"/>
  <path class="edge" d="M1030 338H1070M1090 338H1130"/><path d="M1025 323Q1080 289 1135 323" stroke="#087443" stroke-width="3" fill="none"/>
  <text class="small" x="1210" y="333">
    <tspan x="1210" dy="0">shortens an</tspan>
    <tspan x="1210" dy="17">important route</tspan>
  </text>

  <text class="node-title" x="925" y="425">Reusable hub</text>
  <circle class="newnode" cx="1090" cy="413" r="15"/><circle class="node" cx="1025" cy="388" r="9"/><circle class="node" cx="1025" cy="438" r="9"/><circle class="node" cx="1155" cy="388" r="9"/><circle class="node" cx="1155" cy="438" r="9"/>
  <path class="edge" d="M1034 391L1075 408M1034 435L1075 418M1105 408L1146 391M1105 418L1146 435"/>
  <text class="small" x="1210" y="408">
    <tspan x="1210" dy="0">interface reused</tspan>
    <tspan x="1210" dy="17">by many results</tspan>
  </text>

  <text class="node-title" x="925" y="505">Reorganization</text>
  <path d="M1035 525H1190" stroke="#7f56d9" stroke-width="2"/>
  <circle class="node" cx="1055" cy="525" r="8"/><circle class="newnode" cx="1115" cy="525" r="11"/><circle class="node" cx="1175" cy="525" r="8"/>
  <text class="small" x="1210" y="493">
    <tspan x="1210" dy="0">changes the graph's</tspan>
    <tspan x="1210" dy="17">structural spine</tspan>
  </text>
</svg>
