<p id="A3.SS2.p12.3" class="ltx_p"><span id="A3.SS2.p12.3.1" class="ltx_text">The scalar <math id="A3.SS2.p12.m1" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi>a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math> is the same for every <math id="A3.SS2.p12.m2" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi>i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>.
