<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" role="img" aria-labelledby="gc-title gc-desc">
<title id="gc-title">Gaussian cloud Section 6 recursive-call and accumulated-error ledger</title>
<desc id="gc-desc">The upper lane controls adaptive request count. The lower lane telescopes conditional-kernel replacement errors. They meet at the deterministic global cap.</desc>
<rect width="1180" height="760" fill="#fff"/>
<defs><marker id="gc-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8e3030"/></marker></defs>
<text x="30" y="38" font-family="sans-serif" font-size="25" fill="#18212f">Section 6: two ledgers, one auditable cap</text>
<text x="30" y="68" font-family="sans-serif" font-size="16" fill="#6c3434">Every red node is a source-pinned Lean obligation, not a compiled theorem.</text>
<text x="30" y="118" font-family="sans-serif" font-size="20" font-weight="600" fill="#26364a">Call ledger</text>
<text x="30" y="410" font-family="sans-serif" font-size="20" font-weight="600" fill="#26364a">Error ledger</text>
<g><rect x="30" y="145" width="245" height="110" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="46" y="185" font-family="sans-serif" font-size="20" fill="#652020">q roots</text>
<text x="46" y="219" font-family="sans-serif" font-size="16" fill="#493434">A₀ = q</text></g>
<g><rect x="320" y="145" width="245" height="110" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="336" y="185" font-family="sans-serif" font-size="20" fill="#652020">Process vertex v</text>
<text x="336" y="219" font-family="sans-serif" font-size="16" fill="#493434">Aᵥ₊₁ = Aᵥ − 1 + ζᵥ₊₁</text></g>
<g><rect x="610" y="145" width="245" height="110" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="626" y="185" font-family="sans-serif" font-size="20" fill="#652020">Stop at empty queue</text>
<text x="626" y="219" font-family="sans-serif" font-size="16" fill="#493434">T = inf {v : Aᵥ = 0}</text></g>
<g><rect x="900" y="145" width="245" height="110" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="916" y="185" font-family="sans-serif" font-size="20" fill="#652020">Query count</text>
<text x="916" y="219" font-family="sans-serif" font-size="16" fill="#493434">Qref ≤ Qloc T</text></g>
<g><rect x="465" y="290" width="250" height="90" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="481" y="330" font-family="sans-serif" font-size="20" fill="#652020">Deterministic cap</text>
<text x="481" y="364" font-family="sans-serif" font-size="16" fill="#493434">Tmax fixed; dummy-fill</text></g>
<g><rect x="30" y="440" width="245" height="110" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="46" y="480" font-family="sans-serif" font-size="20" fill="#652020">Ideal slot t</text>
<text x="46" y="514" font-family="sans-serif" font-size="16" fill="#493434">Kₜ(Hₜ₋₁, ·)</text></g>
<g><rect x="320" y="440" width="245" height="110" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="336" y="480" font-family="sans-serif" font-size="20" fill="#652020">Implemented slot t</text>
<text x="336" y="514" font-family="sans-serif" font-size="16" fill="#493434">K̂ₜ(Hₜ₋₁, ·)</text></g>
<g><rect x="610" y="440" width="245" height="110" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="626" y="480" font-family="sans-serif" font-size="20" fill="#652020">Adjacent hybrid</text>
<text x="626" y="514" font-family="sans-serif" font-size="16" fill="#493434">charge δₜ once</text></g>
<g><rect x="900" y="440" width="245" height="110" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="916" y="480" font-family="sans-serif" font-size="20" fill="#652020">Finite telescope</text>
<text x="916" y="514" font-family="sans-serif" font-size="16" fill="#493434">Σₜ δₜ</text></g>
<g><rect x="465" y="610" width="250" height="90" rx="10" fill="#fff4f3" stroke="#ba3535" stroke-width="2"/>
<text x="481" y="650" font-family="sans-serif" font-size="20" fill="#652020">Final output error</text>
<text x="481" y="684" font-family="sans-serif" font-size="16" fill="#493434">Σₜ δₜ + εcap</text></g>
<path d="M275,200 H315" fill="none" stroke="#8e3030" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gc-arrow)"/>
<path d="M565,200 H605" fill="none" stroke="#8e3030" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gc-arrow)"/>
<path d="M855,200 H895" fill="none" stroke="#8e3030" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gc-arrow)"/>
<path d="M1020,255 C1020,330 720,335 720,335" fill="none" stroke="#8e3030" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gc-arrow)"/>
<path d="M275,495 H315" fill="none" stroke="#8e3030" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gc-arrow)"/>
<path d="M565,495 H605" fill="none" stroke="#8e3030" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gc-arrow)"/>
<path d="M855,495 H895" fill="none" stroke="#8e3030" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gc-arrow)"/>
<path d="M1020,550 C1020,655 720,655 720,655" fill="none" stroke="#8e3030" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gc-arrow)"/>
<path d="M590,380 V435" fill="none" stroke="#8e3030" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gc-arrow)"/>
<text x="735" y="326" font-family="sans-serif" font-size="15" fill="#5e3b3b">cap-failure probability εcap</text>
<text x="610" y="398" font-family="sans-serif" font-size="15" fill="#5e3b3b">common fixed history interface</text></svg>