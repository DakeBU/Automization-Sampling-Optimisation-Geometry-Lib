<p id="S1.p1.1" class="ltx_p">We study the problem of sampling from a centered Gaussian distribution given query access to its
unnormalized density.
Gaussian sampling is a fundamental algorithmic task
with applications in Bayesian inference <cite class="ltx_cite ltx_citemacro_citep">[<a href="#bib.bib1" title="" class="ltx_ref">7</a>]</cite>,
numerical simulation <cite class="ltx_cite ltx_citemacro_citep">[<a href="#bib.bib2" title="" class="ltx_ref">11</a>]</cite>,
and randomized approximation algorithms <cite class="ltx_cite ltx_citemacro_citep">[<a href="#bib.bib15" title="" class="ltx_ref">16</a>]</cite>.</p>
