<figcaption class="ltx_caption ltx_centering" style="font-size:90%;"><span class="ltx_tag ltx_tag_table">Table 1: </span>Gradient query bounds for <math id="S1.T1.m18" class="ltx_Math" alttext="\sqrt{\alpha}\,W_{2}\leqslant\varepsilon" display="inline" intent=":literal"><semantics><mrow><mrow><msqrt><mi>α</mi></msqrt><mo lspace="0.170em" rspace="0em">​</mo><msub><mi>W</mi><mn>2</mn></msub></mrow><mo>⩽</mo><mi>ε</mi></mrow><annotation encoding="application/x-tex">\sqrt{\alpha}\,W_{2}\leqslant\varepsilon</annotation></semantics></math>
at bounded condition number, omitting logarithms. Bold entries are new
results. “Lower bound” means a necessary number of iterations for some
admissible target and an initial distribution with expected energy gap
<math id="S1.T1.m19" class="ltx_Math" alttext="O(d)" display="inline" intent=":literal"><semantics><mrow><mi>O</mi><mo>⁡</mo><mrow><mo stretchy="false">(</mo><mi>d</mi><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">O(d)</annotation></semantics></math>, as specified in <a href="#S1.Thmtheorem2" title="Theorem 1.2 (Stationary bias and iteration lower bounds, informal). ‣ 1.1 Our results and their implications ‣ 1 Introduction ‣ Sharp dimensional analysis of midpoint methods for Langevin sampling" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Theorem</span> <span class="ltx_text ltx_ref_tag">1.2</span></a>.
Poisson methods use at least two grid points and have constant expected
gradient cost per batch. The cited upper bounds have their own
initialization hypotheses; PULMC’s general <math id="S1.T1.m20" class="ltx_Math" alttext="p" display="inline" intent=":literal"><semantics><mi>p</mi><annotation encoding="application/x-tex">p</annotation></semantics></math> bound is discussed below.</figcaption>
