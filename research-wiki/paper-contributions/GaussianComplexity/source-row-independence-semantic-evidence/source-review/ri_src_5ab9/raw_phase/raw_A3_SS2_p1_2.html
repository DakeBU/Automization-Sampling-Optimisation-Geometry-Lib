<p id="A3.SS2.p1.2" class="ltx_p">The vectors <math id="A3.SS2.p1.m4" class="ltx_Math" alttext="\gamma_{1},\ldots,\gamma_{d}" display="inline" intent=":literal"><semantics><mrow><msub><mi>γ</mi><mn>1</mn></msub><mo>,</mo><mi mathvariant="normal">…</mi><mo>,</mo><msub><mi>γ</mi><mi>d</mi></msub></mrow><annotation encoding="application/x-tex">\gamma_{1},\ldots,\gamma_{d}</annotation></semantics></math> are independent
<math id="A3.SS2.p1.m5" class="ltx_Math" alttext="N(0,I_{r})" display="inline" intent=":literal"><semantics><mrow><mi>N</mi><mo>⁡</mo><mrow><mo stretchy="false">(</mo><mn>0</mn><mo>,</mo><msub><mi>I</mi><mi>r</mi></msub><mo stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">N(0,I_{r})</annotation></semantics></math>. Let <math id="A3.SS2.p1.m6" class="ltx_Math" alttext="B\in\mathbb{R}^{d\times r^{2}}" display="inline" intent=":literal"><semantics><mrow><mi>B</mi><mo>∈</mo><msup><mi>ℝ</mi><mrow><mi>d</mi><mo lspace="0.222em" rspace="0.222em">×</mo><msup><mi>r</mi><mn>2</mn></msup></mrow></msup></mrow><annotation encoding="application/x-tex">B\in\mathbb{R}^{d\times r^{2}}</annotation></semantics></math> have
<math id="A3.SS2.p1.m7" class="ltx_Math" alttext="i" display="inline" intent=":literal"><semantics><mi>i</mi><annotation encoding="application/x-tex">i</annotation></semantics></math>th row <math id="A3.SS2.p1.m8" class="ltx_math_unparsed" alttext="d^{-1/2}(\gamma_{i}\otimes t_{i})^{\top}" display="inline" intent=":literal"><semantics><mrow><msup><mi>d</mi><mrow><mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup><msup><mrow><mo stretchy="false">(</mo><msub><mi>γ</mi><mi>i</mi></msub><mo lspace="0.222em" rspace="0.222em">⊗</mo><msub><mi>t</mi><mi>i</mi></msub><mo stretchy="false">)</mo></mrow><mo>⊤</mo></msup></mrow><annotation encoding="application/x-tex">d^{-1/2}(\gamma_{i}\otimes t_{i})^{\top}</annotation></semantics></math>.</p>
