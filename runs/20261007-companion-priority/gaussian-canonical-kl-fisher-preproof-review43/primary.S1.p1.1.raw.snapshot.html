<math id="S1.p1.m3" class="ltx_Math" alttext="V\in C^{2}(\mathbb{R}^{d})" display="inline" intent=":literal"><semantics><mrow><mi>V</mi><mo>∈</mo><mrow><msup><mi>C</mi><mn>2</mn></msup><mo lspace="0em" rspace="0em">​</mo><mrow><mo stretchy="false">(</mo><msup><mi>ℝ</mi><mi>d</mi></msup><mo stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">V\in C^{2}(\mathbb{R}^{d})</annotation></semantics></math> satisfies, for <math id="S1.p1.m4" class="ltx_Math" alttext="0&lt;\alpha\leqslant\beta" display="inline" intent=":literal"><semantics><mrow><mn>0</mn><mo>&lt;</mo><mi>α</mi><mo>⩽</mo><mi>β</mi></mrow><annotation encoding="application/x-tex">0&lt;\alpha\leqslant\beta</annotation></semantics></math>,</p>
