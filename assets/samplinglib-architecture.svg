<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Samplinglib architecture</title>
  <desc id="desc">Textbooks, papers, and SampleWiki problems enter the current ASTIS Harness, where theorem-sized advances are owned by Universal Workers in Frontier Cells, reduced for a Thin Master, independently verified, and stabilized before entering reusable Samplinglib formal memory and the public learning surfaces.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.band{fill:#fff;stroke:#d6dee9;stroke-width:2}.source{fill:#172033;stroke:#172033;stroke-width:2}.board{fill:#fff3d6;stroke:#b54708;stroke-width:2}.cell{fill:#eefbf3;stroke:#087443;stroke-width:2}.worker{fill:#dcfae6;stroke:#087443;stroke-width:1.7}.master{fill:#eef4ff;stroke:#155eef;stroke-width:2}.verify{fill:#fff2c7;stroke:#9a6700;stroke-width:2}.ledger{fill:#f4ebff;stroke:#7f56d9;stroke-width:2}.family{fill:#fff;stroke:#8ba0bb;stroke-width:1.7}.registry{fill:#dcecff;stroke:#155eef;stroke-width:2.2}.surface{fill:#fff;stroke:#155eef;stroke-width:1.8}.title{fill:#172033;font:700 22px Inter,Arial,sans-serif}.band-title{fill:#52657a;font:700 15px Inter,Arial,sans-serif;letter-spacing:1px}.node-title{fill:#172033;font:700 16px Inter,Arial,sans-serif}.node-copy{fill:#52657a;font:13px Inter,Arial,sans-serif}.source-text{fill:#fff;font:600 17px Inter,Arial,sans-serif}.small{fill:#667085;font:12px Inter,Arial,sans-serif}.arrow{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}.feedback{fill:none;stroke:#7f56d9;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#purple)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7f56d9"/></marker>
  </defs>

