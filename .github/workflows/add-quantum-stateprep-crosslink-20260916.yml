name: Add SampleWiki quantum state-preparation spotlight
on:
  push:
    branches:
      - agent/samplewiki-schrodingerisation-link-20260916
    paths:
      - .github/workflows/add-quantum-stateprep-crosslink-20260916.yml
      - .github/scripts/apply_samplewiki_quantum_crosslink_20260916.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/samplewiki-schrodingerisation-link-20260916
          fetch-depth: 0
      - run: python3 .github/scripts/apply_samplewiki_quantum_crosslink_20260916.py
      - run: |
          python3 -m py_compile website/scripts/samplewiki_reader_contract.py
          grep -q 'cross-library-state-preparation' website/scripts/samplewiki_reader_contract.py
          grep -q 'Quantum-Computing-Block-Encoding/example-cases/hermite-smooth-state-preparation' website/scripts/samplewiki_reader_contract.py
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-quantum-stateprep-crosslink-20260916.yml .github/scripts/apply_samplewiki_quantum_crosslink_20260916.py
          git add website/scripts/samplewiki_reader_contract.py
          git commit -m 'Link SampleWiki to structured Schrödingerisation state preparation'
          git push origin HEAD:agent/samplewiki-schrodingerisation-link-20260916
