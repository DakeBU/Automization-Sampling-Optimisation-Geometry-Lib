Gaussian integration gives</span></p>

<p class="ltx_p" id="A3.SS4.p3.2"><span class="ltx_text" id="A3.SS4.p3.2.1">Since <math alttext="\Lambda" class="ltx_Math" display="inline" id="A3.SS4.p3.m2" intent=":literal"><semantics><mi mathvariant="normal">Λ</mi><annotation encoding="application/x-tex">\Lambda</annotation></semantics></math> is fixed, <math alttext="Z_{A}" class="ltx_Math" display="inline" id="A3.SS4.p3.m3" intent=":literal"><semantics><msub><mi>Z</mi><mi>A</mi></msub><annotation encoding="application/x-tex">Z_{A}</annotation></semantics></math> is independent of <math alttext="O" class="ltx_Math" display="inline" id="A3.SS4.p3.m4" intent=":literal"><semantics><mi>O</mi><annotation encoding="application/x-tex">O</annotation></semantics></math>
