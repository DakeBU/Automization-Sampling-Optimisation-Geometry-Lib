name: Bench isolated Lean runtime trials
on:
  pull_request:
    paths:
      - 'tools/sog_bench_lean*.py'
      - 'tools/tests/test_sog_bench_lean*.py'
      - 'benchmarks/samplingoptimisationgeometrybench/lean-runtime/**'
      - 'benchmarks/samplingoptimisationgeometrybench/cores.json'
      - 'benchmarks/samplingoptimisationgeometrybench/reviews/**'
      - 'runs/20261110-bench-local-lean-first/**'
      - 'tools/sog_bench.py'
      - 'AutoSamplingTheory/**'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'lakefile.lean'
      - '.github/workflows/sog-bench-lean.yml'
  push:
    branches: [main]
    paths:
      - 'tools/sog_bench_lean*.py'
      - 'tools/tests/test_sog_bench_lean*.py'
      - 'benchmarks/samplingoptimisationgeometrybench/lean-runtime/**'
      - 'benchmarks/samplingoptimisationgeometrybench/cores.json'
      - 'benchmarks/samplingoptimisationgeometrybench/reviews/**'
      - 'runs/20261110-bench-local-lean-first/**'
      - 'tools/sog_bench.py'
      - 'AutoSamplingTheory/**'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'lakefile.lean'
      - '.github/workflows/sog-bench-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sog-lean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-runtime:
    runs-on: ubuntu-24.04
    # The all-target replay at 3526e21b took nearly the previous job window.
    # Allow CI headroom for the extra paired task, not extra submission time.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Test packet and isolation argument contracts
        run: python -m unittest tools.tests.test_sog_bench_lean tools.tests.test_sog_bench_lean_model tools.tests.test_sog_bench_lean_external tools.tests.test_sog_bench_lean_stdio tools.tests.test_sog_bench_lean_capture
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
      - name: Compile trusted task ancestors and references only
        run: python tools/sog_bench.py check-lean
      - name: Build pinned official tools and record immutable runtime
        run: python tools/sog_bench_lean_native.py prepare --output .astis/lean-native
      - name: Actually test every admitted aligned target and negative software fixtures
        run: python tools/sog_bench_lean_native.py trials --runtime .astis/lean-native
      - name: Actually probe denied I/O and bounded resource and input failures
        run: python tools/sog_bench_lean_native.py hostile-trials --runtime .astis/lean-native
      - name: Replay compiler feedback and immutable first-final accounting
        run: python tools/sog_bench_lean_native.py workspace-trials --runtime .astis/lean-native
      - name: Exercise scripted model interface and canonical infrastructure rollup
        run: python tools/sog_bench_lean_native.py model-bridge-trials --runtime .astis/lean-native
      - name: Reject a changed target through the credential-free JSONL bridge
        run: python tools/sog_bench_lean_native.py stdio-bridge-trial --runtime .astis/lean-native
      - name: Verify the frozen real one-shot model answer, without repair
        run: >-
          python tools/sog_bench_lean_capture.py verify
          --capture runs/20261110-bench-local-lean-first/raw
          --receipt-sha256 17162dc147147f1e6b7849d4528f3d0f5f5b4dc1266b7d2eb532076428d1fa5c
          --task .astis/lean-native/tasks/sogb-015
          --stage .astis/lean-native/stages/sogb-015
          --runtime .astis/lean-native
          --output .astis/lean-native/model-first-capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sog-lean-native-software-evidence
          path: |
            .astis/lean-native/preparation-inputs.json
            .astis/lean-native/preparation.json
            .astis/lean-native/software-trials.json
            .astis/lean-native/hostile-trials.json
            .astis/lean-native/hostile-trials
            .astis/lean-native/workspace-trials.json
            .astis/lean-native/workspace-trials
            .astis/lean-native/model-bridge-trials.json
            .astis/lean-native/model-bridge-trials
            .astis/lean-native/stdio-bridge-trial
            .astis/lean-native/model-first-capture
            .astis/lean-native/image-id
            .astis/lean-native/trials
          retention-days: 14
